<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú del sitio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav style="width: 1440px; height: 88px; box-sizing: border-box; padding: 0px 96px; display: flex; align-items: center; gap: 40px; background: #0F1B2D; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif" aria-label="Principal">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none" aria-label="Avanza Freight TMS, inicio">
<svg width="43" height="36" viewBox="0 0 142 120" aria-hidden="true"><mask id="m-menu" maskUnits="userSpaceOnUse" x="0" y="0" width="142" height="120"><rect width="142" height="120" fill="#fff"></rect><path d="M16 108 C 50 84, 80 70, 121 67" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round"></path></mask><polygon points="70,8 122,112 98,112 70,54 42,112 18,112" fill="#FFFFFF" mask="url(#m-menu)"></polygon><path d="M16 108 C 50 84, 80 70, 117 67" fill="none" stroke="#E8702A" stroke-width="14" stroke-linecap="round"></path><polygon points="113,52 136.1,67 113,82" fill="#E8702A"></polygon></svg>
<span style="display: flex; flex-direction: column; gap: 5px">
<span style="font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 800; font-stretch: 118%; line-height: 1; color: #FFFFFF">AVANZA</span>
<span style="display: flex; align-items: center; gap: 7px; font-family: 'Archivo', sans-serif; font-size: 9px; letter-spacing: 0.3em; line-height: 1"><span style="font-weight: 600; color: #C3C9D3">FREIGHT</span><span style="padding: 2px 3px 2px 5px; border-radius: 3px; background: #E8702A; color: #0F1B2D; font-weight: 800; letter-spacing: 0.2em">TMS</span></span>
</span>
</a>
<div style="display: flex; gap: 32px; font-size: 15px; font-weight: 500; flex-grow: 1; justify-content: center">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<a href="{{it.href}}" style="{{it.estilo}}">{{it.label}}</a>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 20px; font-size: 15px">
<a href="#" style="color: #DDE2EA; text-decoration: none; padding: 6px 10px; border: 1px solid #3A4659; border-radius: 6px; font-size: 13px; font-weight: 600" aria-label="English version">ES · EN</a>
<a href="#" style="color: #FFFFFF; text-decoration: none; font-weight: 500">Iniciar sesión</a>
<a href="#" style="display: flex; align-items: center; height: 44px; padding: 0px 20px; border-radius: 8px; background: #E8702A; color: #0F1B2D; text-decoration: none; font-weight: 700">Empieza gratis</a>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activo":{"editor":"enum","options":["","producto","soluciones","precios","recursos","nosotros"],"default":""},"$preview":{"width":1440,"height":88}}'>
class Component extends DCLogic {
renderVals() {
const activo = this.props.activo ?? '';
const base = 'text-decoration: none; padding: 6px 0px; ';
const xs = [
{ k: 'producto', label: 'Producto', href: 'Producto.dc.html' },
{ k: 'soluciones', label: 'Soluciones', href: 'Soluciones.dc.html' },
{ k: 'precios', label: 'Precios', href: 'Precios.dc.html' },
{ k: 'recursos', label: 'Recursos', href: 'Recursos.dc.html' },
{ k: 'nosotros', label: 'Nosotros', href: 'Nosotros.dc.html' }
];
return {
items: xs.map((x) => ({ ...x, estilo: base + (x.k === activo ? 'color: #FFFFFF; font-weight: 700; border-bottom: 2px solid #E8702A' : 'color: #DDE2EA; border-bottom: 2px solid transparent') }))
};
}
}
</script>
</body>
</html>
